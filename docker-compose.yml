version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_library_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: smart_library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: smart_library_api_api_1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:tu_password@db:5432/smart_library_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: